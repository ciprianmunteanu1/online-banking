services:
  postgres:
    image: postgres:16-alpine
    container_name: ob-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: onlinebanking
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ob-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/onlinebanking?schema=public"
      JWT_SECRET: "super-secret-jwt-key-change-in-production"
      JWT_REFRESH_SECRET: "super-secret-refresh-key-change-in-production"
      JWT_EXPIRATION: "15m"
      JWT_REFRESH_EXPIRATION: "7d"
      GOOGLE_CLIENT_ID: "your-google-client-id"
      GOOGLE_CLIENT_SECRET: "your-google-client-secret"
      GOOGLE_CALLBACK_URL: "http://localhost:3000/auth/google/callback"
      ENCRYPTION_KEY: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6"
      PORT: "3000"
      FRONTEND_URL: "http://localhost"
      STEP_UP_THRESHOLD_AMOUNT: "5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ob-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
